name: Build FlashPull EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build EXE
        run: python -m PyInstaller --onefile --noconsole --name FlashPull flashpull.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FlashPull-EXE
          path: dist/FlashPull.exe
